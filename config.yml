recipe: default.v1

assistant_id: 20260707-123159-calm-accuracy

language: en

pipeline:
  # NOTE: EntitySynonymMapper and ResponseSelector were removed 2026-09-15 as
  # part of Worksheet 9's pipeline critical analysis. Neither had any effect
  # on this bot:
  #   - EntitySynonymMapper only fires when nlu.yml declares synonym entities
  #     with the `synonyms:` key, which this project does not use.
  #   - ResponseSelector only fires for retrieval intents (chitchat/FAQ with
  #     multiple example → multiple response variants). This bot uses rule-
  #     based response selection instead.
  # Removing them simplifies the pipeline without any observable change in NLU
  # behaviour; training time did not change measurably (44.75 s vs 44.95 s).
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  # random_seed: DIET, TED and UnexpecTED default to RANDOM_SEED None
  # (rasa/nlu/classifiers/diet_classifier.py:188-189, core/policies/
  # ted_policy.py:244), so two trainings on the same data differ and a
  # before/after comparison mixes the change with noise. The lecturer
  # notebooks fix a seed, 42 in most of them.
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
    random_seed: 42
  # 0.7 chosen on 2026-10-03 from
  # scripts/threshold_sweep.py on the development sets only, for the model
  # trained on this data. The one fixed limit, request_human_advisor recall
  # >= 0.85, holds at every threshold tried (7/8). Against 0.6, 0.7 raises the
  # accuracy of the answers the bot commits to from 0.873 to 0.908 and sends
  # 3 more off-topic messages to clarification, at the cost of 6 more real
  # requests (fallback rate 16.5% -> 23.5%); 0.8 loses more automation and
  # macro F1 (0.724). A wrong answer costs more than a clarification question.
  - name: FallbackClassifier
    threshold: 0.7
    ambiguity_threshold: 0.1
  # Deterministic gate. Runs last, so it
  # can override both DIET and the fallback: empty or over-long messages go to
  # `invalid_input`; text matching a pattern in data/safety_patterns.yml goes
  # to that category's intent (regulated advice, abuse). Mirrors the
  # lecturer's regex safety gate (LLM components notebook, §17); conservative and incomplete
  # by design, DIET still classifies everything the patterns do not list.
  - name: components.safety_gate.SafetyGate
    patterns_file: data/safety_patterns.yml
    max_chars: 500

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    # NOT action_two_stage_fallback. That loop is for the NLU fallback (the
    # message was not understood). Used here, for "understood but no rule
    # covers it", it activated, deactivated silently and was re-predicted
    # forever — "What is 2+2" (inform) froze the server. See
    # ActionCoreFallback in actions/actions.py.
    core_fallback_action_name: action_core_fallback
    enable_fallback_prediction: true
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
    random_seed: 42
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
    random_seed: 42
