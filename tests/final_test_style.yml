# FINAL TEST SET - frozen. Written without access to the training data.
# Run ONCE on the final model (HANDOFF Adim 4). Never add these sentences to data/nlu.yml;
# never change them to improve a number. Guarded by the disjointness test.
# STYLE subgroups (typo / informal / negation); tag counts are in HANDOFF.

version: "3.1"
nlu:
- intent: ask_eco_hotels
  examples: |
    - ecofriendly hotles in amsterdm?
    - Not a big chain hotel please, something sustainable in Paris.
- intent: ask_weather
  examples: |
    - wats the wether like in lisbon
- intent: ask_currency
  examples: |
    - how much is 100 euro in dollers
- intent: request_human_advisor
  examples: |
    - can i tlak to a real persn
    - gimme a human pls
    - I don't want to talk to a bot anymore, get me a person.
- intent: ask_carbon_footprint
  examples: |
    - how much co2 dose a fligth to berlin make
- intent: plan_trip
  examples: |
    - i wnat to plan a trp to barcleona
    - yo help me sort a trip to rome real quick
- intent: ask_green_transport
  examples: |
    - best way to get to paris w/o flying, im broke n care about the planet lol
    - I don't want to fly to Barcelona, what else is there?
- intent: greet
  examples: |
    - heyyy wassup
- intent: ask_local_activities
  examples: |
    - whats there to do in berlin thats not a tourist trap tbh
- intent: ask_carbon_offset
  examples: |
    - me want pay for trees to fix my flight co2, how
- intent: stop
  examples: |
    - No, I don't want to answer any more questions.
