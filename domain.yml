version: "3.1"

intents:
  - greet
  - goodbye
  - ask_weather
  - ask_currency
  - plan_trip
  - ask_eco_hotels
  - ask_green_transport
  - ask_carbon_footprint
  - ask_local_activities
  - ask_carbon_offset
  - request_human_advisor
  - ask_place_description
  - bot_challenge
  - thank_you
  - inform
  # Genuinely off-topic asks (general knowledge, personal-assistant chores).
  # Separate from out_of_scope, which Rasa's two-stage fallback reserves for
  # the "None of these" denial inside the clarification loop.
  - off_topic
  # Requests the bot must handle safely: it cannot book, give regulated advice, etc.
  - ask_booking
  - ask_regulated_advice
  - insult
  - stop
  - ask_privacy
  # Set only by components.safety_gate.SafetyGate (empty or over-long text); no training examples.
  - invalid_input
  - out_of_scope

entities:
  - city_name
  - from_currency
  - to_currency
  - destination
  - origin
  - transport_mode
  - travel_dates
  - budget
  - sustainability_level
  - transport_preference
  - trip_length

slots:
  city_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: city_name

  from_currency:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: from_currency

  to_currency:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: to_currency

  destination:
    type: text
    influence_conversation: false
    mappings:
      # Global from_entity: outside the form (e.g. "hotels in Barcelona") we
      # still want the destination slot to be filled from NLU entities.
      - type: from_entity
        entity: destination
        conditions:
          - active_loop: null
      # Inside the trip planning form, when we are asking for destination,
      # take whatever the user typed as-is. This avoids the extractor picking
      # only a partial token from a natural answer.
      - type: from_text
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: destination

  origin:
    type: text
    influence_conversation: false
    mappings:
      # Outside the form: "green transport from London to Paris" fills this
      # from the NLU entity. Inside the form it is asked directly, and the
      # whole reply is taken as the answer (same reasoning as destination).
      - type: from_entity
        entity: origin
        conditions:
          - active_loop: null
      - type: from_text
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: origin

  transport_mode:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: transport_mode

  travel_dates:
    type: text
    influence_conversation: false
    mappings:
      # Only from_text: entity extraction on a natural date phrase like
      # "next week" often clips to a single token ("next"). from_text
      # takes the entire user reply during the form.
      - type: from_text
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: travel_dates

  budget:
    type: text
    influence_conversation: false
    mappings:
      # Only from_text — free-form numeric input is easier to accept as a
      # whole and validate in Python than to entity-annotate.
      - type: from_text
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: budget

  sustainability_level:
    type: categorical
    values:
      - low
      - medium
      - high
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: sustainability_level
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: sustainability_level
      - type: from_text
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: sustainability_level

  transport_preference:
    type: categorical
    values:
      - train_or_bus
      - any_low_carbon
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: transport_preference
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: transport_preference
      - type: from_text
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: transport_preference

  trip_length:
    type: categorical
    values:
      - weekend
      - week
      - extended
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: trip_length
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: trip_length
      - type: from_text
        not_intent: [request_human_advisor, stop, ask_regulated_advice, ask_booking, insult, ask_privacy, invalid_input]
        conditions:
          - active_loop: trip_planning_form
            requested_slot: trip_length

  handover_active:
    type: bool
    influence_conversation: false
    initial_value: false
    mappings:
      - type: custom

  # JSON snapshot of the last completed trip plan. The form clears its own
  # slots on submit, so without this a handover right after planning would
  # reach the advisor with almost nothing.
  last_trip_summary:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

forms:
  # Form exits: every form-scoped slot mapping above carries a not_intent
  # list. A message with one of those intents is never taken as a slot answer;
  # data/rules.yml handles it instead (hand over, cancel, or answer and return
  # to the same question). Rasa needs a rule for each excluded intent, because
  # the form cannot fill a slot that turn and does not continue by itself.
  trip_planning_form:
    # NOTE: only destination/dates/budget/sustainability_level are asked every
    # time. transport_preference and trip_length are added dynamically by
    # ValidateTripPlanningForm.required_slots() when the user's earlier
    # answers make them relevant. They must still be declared here so their
    # slot mappings are recognised.
    required_slots:
      - destination
      - origin
      - travel_dates
      - budget
      - sustainability_level
      - transport_preference
      - trip_length

actions:
  - action_get_weather
  - action_get_currency
  - action_suggest_eco_hotels
  - action_suggest_transport
  - action_calculate_carbon
  - action_suggest_activities
  - action_carbon_offset_programs
  - action_human_handover
  - action_submit_trip_form
  - action_default_fallback
  - action_default_ask_affirmation
  - action_core_fallback
  # action_deactivate_loop is NOT listed here: listing a default action tells
  # Rasa a custom one exists on the action server, and the built-in one (which
  # emits ActiveLoop(None)) is then never run. Found by the smoke test.
  - action_describe_place
  - action_cancel_trip_form
  # Asks the destination question with city buttons (brief: quick-reply
  # buttons generated from custom action responses). Rasa looks for
  # action_ask_<form>_<slot> before utter_ask_<form>_<slot>.
  - action_ask_trip_planning_form_destination
  - validate_trip_planning_form

responses:
  utter_greet:
    - text: "Hello! I am your Eco-Travel Advisor. I can help you plan a sustainable trip, compare low-carbon transport, estimate carbon footprints, find places to stay, check the weather or convert currencies. What would you like to do?"

  utter_goodbye:
    - text: "Goodbye! Travel light on the planet."

  utter_ask_trip_planning_form_destination:
    - text: "Great — where would you like to travel? (e.g. Barcelona, Kyoto, Amsterdam)"

  utter_ask_trip_planning_form_origin:
    - text: "And where will you be travelling from? (I use this to compare transport options and their carbon cost)"

  utter_ask_trip_planning_form_travel_dates:
    - text: "When are you planning to travel? (e.g. 15-20 August, next week)"

  utter_ask_trip_planning_form_budget:
    - text: "What is your approximate budget in EUR? (e.g. 800)"

  utter_ask_trip_planning_form_sustainability_level:
    - text: "How important is sustainability for this trip?"
      buttons:
        - title: "Low"
          payload: '/inform{"sustainability_level":"low"}'
        - title: "Medium"
          payload: '/inform{"sustainability_level":"medium"}'
        - title: "High"
          payload: '/inform{"sustainability_level":"high"}'

  utter_ask_trip_planning_form_transport_preference:
    - text: "You picked high sustainability — how do you want to get around?"
      buttons:
        - title: "Train or bus only"
          payload: '/inform{"transport_preference":"train_or_bus"}'
        - title: "Any low-carbon option"
          payload: '/inform{"transport_preference":"any_low_carbon"}'

  utter_ask_trip_planning_form_trip_length:
    - text: "With that budget, how long a trip do you have in mind?"
      buttons:
        - title: "Weekend"
          payload: '/inform{"trip_length":"weekend"}'
        - title: "One week"
          payload: '/inform{"trip_length":"week"}'
        - title: "Extended"
          payload: '/inform{"trip_length":"extended"}'

  # Stage 2 of the built-in two-stage fallback. Saying only "I didn't follow"
  # leaves the user guessing what this bot is even for, so the second attempt
  # states the scope and offers the three things it does most often. It still
  # says plainly that it did not understand — no pretending otherwise.
  utter_ask_rephrase:
    - text: |-
        Sorry, I still didn't follow. I'm an eco-travel assistant: I can plan a sustainable trip, compare low-carbon ways to travel, estimate a journey's carbon footprint, and suggest places to stay and things to do.
        Could you say it another way, or pick one of these?
      buttons:
        - title: "Plan a sustainable trip"
          payload: "/plan_trip"
        - title: "Low-carbon transport"
          payload: "/ask_green_transport"
        - title: "Places to stay"
          payload: "/ask_eco_hotels"

  # Same idea for a message the bot understood as being outside its scope.
  utter_out_of_scope_help:
    - text: |-
        That one is outside what I can help with. I'm an eco-travel assistant: I can plan a sustainable trip, compare low-carbon ways to travel, estimate a journey's carbon footprint, and suggest places to stay and things to do.
      buttons:
        - title: "Plan a sustainable trip"
          payload: "/plan_trip"
        - title: "Low-carbon transport"
          payload: "/ask_green_transport"
        - title: "Talk to a human advisor"
          payload: "/request_human_advisor"

  utter_booking_not_possible:
    - text: |-
        I can't make bookings or show live prices — I'm an advice assistant, not a booking system, and any price I give is an estimate. I can help you plan the trip, compare low-carbon options and their estimated costs, or pass you to a human travel advisor who can help with bookings.
      buttons:
        - title: "Plan a sustainable trip"
          payload: "/plan_trip"
        - title: "Low-carbon transport"
          payload: "/ask_green_transport"
        - title: "Talk to a human advisor"
          payload: "/request_human_advisor"

  utter_regulated_advice:
    - text: |-
        I can't give visa, entry, health or safety advice: the rules change and depend on your nationality and situation, and a wrong answer could cost you a trip or harm you. Please check official sources — the destination country's embassy or consulate, your government's official travel advice, and a doctor or travel clinic for vaccinations and medication. A human advisor can also help.
      buttons:
        - title: "Talk to a human advisor"
          payload: "/request_human_advisor"
        - title: "Plan a sustainable trip"
          payload: "/plan_trip"

  utter_insult_response:
    - text: |-
        Sorry this hasn't been helpful. I'm a fairly simple eco-travel assistant, so I may have misunderstood you. Tell me what you're trying to do in a few words, or I can pass you to a human advisor.
      buttons:
        - title: "Talk to a human advisor"
          payload: "/request_human_advisor"
        - title: "Plan a sustainable trip"
          payload: "/plan_trip"

  utter_privacy:
    - text: |-
        Here is what happens to what you tell me: I keep your answers only for this conversation so I can make recommendations, and nothing is written to a database — it is gone when the bot restarts. If you ask for a human advisor, a summary of the conversation is written to the server log in this demo. I never ask for payment or passport details. This is a student prototype, not a certified service. You can wipe this conversation at any time with "Start over".
      buttons:
        - title: "Start over"
          payload: "/restart"
        - title: "Plan a sustainable trip"
          payload: "/plan_trip"

  utter_invalid_input:
    - text: "That message was empty or longer than I can handle (500 characters). Could you send it again in a shorter form?"

  utter_bot_challenge:
    - text: |-
        I'm a bot — an eco-travel assistant built on Rasa. Here is what I can do:
        • Plan a sustainable trip through a few questions (destination, dates, budget, how much sustainability matters to you)
        • Compare trains, buses, cars and flights by carbon and estimated cost
        • Estimate the carbon footprint of a specific journey
        • Suggest places to stay, ranked by transit access and scale
        • Suggest community-friendly things to do, and carbon offset programmes
        • Describe a city, check its weather, and convert currencies
        • Hand you to a human travel advisor with the full conversation when you want one
      buttons:
        - title: "Plan a sustainable trip"
          payload: "/plan_trip"
        - title: "Places to stay"
          payload: "/ask_eco_hotels"
        - title: "Talk to a human advisor"
          payload: "/request_human_advisor"

  utter_acknowledge:
    - text: "Okay. I'm here if you want to plan a trip or compare ways to travel."

  utter_you_are_welcome:
    - text: "You're welcome. Anything else I can help you plan?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
