# A lookup table feeds the RegexFeaturizer already in the pipeline: tokens
# that match get an extra feature, which helps DIET tell "tell me about
# Kyoto" (a place) from "tell me about Rasa" (a tool).
- lookup: destination
  examples: |
    - Barcelona
    - Amsterdam
    - Kyoto
    - Lisbon
    - Berlin
    - Paris
    - Copenhagen
    - Oslo
    - Madrid
    - Rome
    - Vienna
    - Prague
    - Stockholm
    - Athens
    - Istanbul
    - London
    - Porto
    - Munich
    - Milan
    - Brussels
    - Helsinki
    - Dublin
    - Zurich
    - Budapest
    - Warsaw

