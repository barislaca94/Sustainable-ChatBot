version: "3.1"

rules:
- rule: Respond to greetings
  steps:
  - intent: greet
  - action: utter_greet

- rule: Respond to goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Get weather for a city
  steps:
  - intent: ask_weather
  - action: action_get_weather

- rule: Get currency exchange rate
  steps:
  - intent: ask_currency
  - action: action_get_currency

- rule: Suggest eco hotels
  steps:
  - intent: ask_eco_hotels
  - action: action_suggest_eco_hotels

- rule: Suggest green transport
  steps:
  - intent: ask_green_transport
  - action: action_suggest_transport

- rule: Calculate carbon footprint
  steps:
  - intent: ask_carbon_footprint
  - action: action_calculate_carbon

- rule: Suggest local activities
  steps:
  - intent: ask_local_activities
  - action: action_suggest_activities

- rule: Show carbon offset programs
  steps:
  - intent: ask_carbon_offset
  - action: action_carbon_offset_programs

- rule: Escalate to human advisor
  condition:
  - active_loop: null
  steps:
  - intent: request_human_advisor
  - action: action_human_handover

- rule: Describe a place from Wikipedia
  steps:
  - intent: ask_place_description
  - action: action_describe_place

- rule: Activate trip planning form
  steps:
  - intent: plan_trip
  - action: trip_planning_form
  - active_loop: trip_planning_form

- rule: Submit trip planning form
  condition:
  - active_loop: trip_planning_form
  steps:
  - action: trip_planning_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_submit_trip_form

- rule: Answer who/what the bot is
  steps:
  - intent: bot_challenge
  - action: utter_bot_challenge

- rule: Acknowledge thanks
  steps:
  - intent: thank_you
  - action: utter_you_are_welcome

- rule: Two-stage fallback loop
  steps:
  - intent: nlu_fallback
  - action: action_two_stage_fallback
  - active_loop: action_two_stage_fallback

# A bare answer ("Barcelona", "1500") with no question to answer. Without
# this rule TEDPolicy guessed, and usually guessed the greeting.
- rule: Answer given outside the trip form
  condition:
  - active_loop: null
  steps:
  - intent: inform
  - action: action_core_fallback

- rule: Explain scope for an off-topic message
  steps:
  - intent: off_topic
  - action: utter_out_of_scope_help

# Only OUTSIDE the fallback loop. Inside it, out_of_scope is the "None of
# these" answer and action_two_stage_fallback handles it itself.
- rule: Explain scope when the user rejects every suggestion
  condition:
  - active_loop: null
  steps:
  - intent: out_of_scope
  - action: utter_acknowledge

# Adim 2: requests the bot must handle safely (docs/INTENT_DEFINITIONS.md)
- rule: Explain that the bot cannot book or show live prices
  condition:
  - active_loop: null
  steps:
  - intent: ask_booking
  - action: utter_booking_not_possible

- rule: Refer visa, health and safety questions to official sources
  condition:
  - active_loop: null
  steps:
  - intent: ask_regulated_advice
  - action: utter_regulated_advice

- rule: Respond calmly to an insult
  condition:
  - active_loop: null
  steps:
  - intent: insult
  - action: utter_insult_response

- rule: Explain what happens to the user's data
  condition:
  - active_loop: null
  steps:
  - intent: ask_privacy
  - action: utter_privacy

- rule: Ask for a shorter message when the input is empty or too long
  condition:
  - active_loop: null
  steps:
  - intent: invalid_input
  - action: utter_invalid_input

# Adim 3 (A1): leaving or interrupting the trip form. The form's slot mappings
# exclude these intents (domain.yml not_intent), so each needs a rule here.
- rule: Human requested during the trip form
  condition:
  - active_loop: trip_planning_form
  steps:
  - intent: request_human_advisor
  - action: action_human_handover
  - action: action_deactivate_loop
  - active_loop: null

- rule: Stop requested during the trip form
  condition:
  - active_loop: trip_planning_form
  steps:
  - intent: stop
  - action: action_deactivate_loop
  - active_loop: null
  - action: action_cancel_trip_form

- rule: Stop requested when nothing is in progress
  condition:
  - active_loop: null
  steps:
  - intent: stop
  - action: utter_acknowledge

- rule: Answer ask_booking during the trip form, then ask the same question again
  condition:
  - active_loop: trip_planning_form
  steps:
  - intent: ask_booking
  - action: utter_booking_not_possible
  - action: trip_planning_form
  - active_loop: trip_planning_form

- rule: Answer ask_regulated_advice during the trip form, then ask the same question again
  condition:
  - active_loop: trip_planning_form
  steps:
  - intent: ask_regulated_advice
  - action: utter_regulated_advice
  - action: trip_planning_form
  - active_loop: trip_planning_form

- rule: Answer insult during the trip form, then ask the same question again
  condition:
  - active_loop: trip_planning_form
  steps:
  - intent: insult
  - action: utter_insult_response
  - action: trip_planning_form
  - active_loop: trip_planning_form

- rule: Answer ask_privacy during the trip form, then ask the same question again
  condition:
  - active_loop: trip_planning_form
  steps:
  - intent: ask_privacy
  - action: utter_privacy
  - action: trip_planning_form
  - active_loop: trip_planning_form

- rule: Answer invalid_input during the trip form, then ask the same question again
  condition:
  - active_loop: trip_planning_form
  steps:
  - intent: invalid_input
  - action: utter_invalid_input
  - action: trip_planning_form
  - active_loop: trip_planning_form
