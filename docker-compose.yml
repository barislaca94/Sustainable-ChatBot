# Local orchestration of the three services making up the Eco-Travel Advisor.
#
# Usage:
#   cp .env.example .env      # required by env_file below; the key inside is optional
#   docker compose up --build
#   # then browse to http://localhost:8501
#
# Only the Streamlit UI is published on the host. Rasa and the action server
# are reachable only on the internal network (brief, page-5 diagram:
# "internal net — action server not public").
#
# The Rasa image uses the trained model committed in models/ (see
# Dockerfile.rasa). Retrain and update that file name if any yml file changes.

services:

  rasa:
    build:
      context: .
      dockerfile: Dockerfile.rasa
    image: eco-travel-rasa
    expose:
      - "5005"
    depends_on:
      - actions
    networks:
      - eco-net
    restart: unless-stopped
    healthcheck:
      # Root route: /status exists only with --enable-api, which is off.
      test: ["CMD", "curl", "-f", "http://localhost:5005/"]
      interval: 30s
      timeout: 10s
      retries: 5

  actions:
    build:
      context: .
      dockerfile: Dockerfile.actions
    image: eco-travel-actions
    expose:
      - "5055"
    networks:
      - eco-net
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: eco-travel-streamlit
    ports:
      - "8501:8501"
    environment:
      RASA_URL: http://rasa:5005/webhooks/rest/webhook
    depends_on:
      - rasa
    networks:
      - eco-net
    restart: unless-stopped

networks:
  eco-net:
    driver: bridge
